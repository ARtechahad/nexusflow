    <script>
      (function() {
        try {
          const mode = localStorage.getItem('clientops_theme_mode') || localStorage.getItem('clientops_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          const root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Filter benign Vite HMR websocket connection messages in sandboxed iframe previews
      if (typeof window !== 'undefined' && window.console && window.console.error) {
        const _origConsoleError = window.console.error;
        window.console.error = function (...args) {
          const firstArg = typeof args[0] === 'string' ? args[0] : '';
          if (
            firstArg.includes('[vite] failed to connect to websocket') ||
            (firstArg === '[vite]' && typeof args[1] === 'string' && args[1].includes('websocket'))
          ) {
            return;
          }
          _origConsoleError.apply(window.console, args);
        };
      }
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#090D16] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-indigo-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
