<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:description" content="Standard operating procedure and management platform for web development sales and coordination teams handling international clients, featuring lead pipeline, commission calculator, task boards, secure files, and team collaboration." />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClientOps" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const mode = localStorage.getItem('clientops_theme_mode') || localStorage.getItem('clientops_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
          const root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Filter benign Vite HMR websocket connection messages in sandboxed iframe previews
      if (typeof window !== 'undefined' && window.console && window.console.error) {
        const _origConsoleError = window.console.error;
        window.console.error = function (...args) {
          const firstArg = typeof args[0] === 'string' ? args[0] : '';
          if (
            firstArg.includes('[vite] failed to connect to websocket') ||
            (firstArg === '[vite]' && typeof args[1] === 'string' && args[1].includes('websocket'))
          ) {
            return;
          }
          _origConsoleError.apply(window.console, args);
        };
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#080b11] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
