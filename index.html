    <script>
      (function() {
        try {
          var mode = localStorage.getItem('clientops_theme_mode') || localStorage.getItem('clientops_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      if (typeof window !== 'undefined' && window.console && window.console.error) {
        var _origConsoleError = window.console.error;
        window.console.error = function () {
          var firstArg = typeof arguments[0] === 'string' ? arguments[0] : '';
          if (
            firstArg.includes('[vite] failed to connect to websocket') ||
            (firstArg === '[vite]' && typeof arguments[1] === 'string' && arguments[1].includes('websocket'))
          ) {
            return;
          }
          return _origConsoleError.apply(window.console, arguments);
        };
      }
    </script>
